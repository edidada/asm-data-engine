name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Build / Test / Benchmark (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          nasm -v

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Synthetic data engine smoke test
        run: |
          python3 scripts/convert.py --synthetic 1000000 /tmp/amounts.bin
          ./build/asm-stat --input /tmp/amounts.bin --engine auto
          ./build/asm-stat --input /tmp/amounts.bin --engine scalar
          ./build/asm-stat --input /tmp/amounts.bin --engine sse2
          ./build/asm-stat --input /tmp/amounts.bin --engine avx2
          ./build/asm-stat --input /tmp/amounts.bin --engine avx512

      - name: V6 large-file smoke (asm-gen, 5M records)
        run: |
          ./build/asm-gen --out /tmp/big.bin --count 5000000
          ./build/asm-stat --input /tmp/big.bin --engine auto --threads 4 --io mmap --repeat 2
          ./build/asm-stat --input /tmp/big.bin --engine scalar --threads 1 --io read --chunk-mb 1
          ./build/asm-stat --input /tmp/big.bin --engine sse2 --threads 4 --io read --chunk-mb 1
          ./build/asm-stat --input /tmp/big.bin --engine avx2 --threads 0 --io auto
          ./build/asm-stat --input /tmp/big.bin --engine avx512 --threads 2 --repeat 1

      - name: perf smoke (best effort, V7)
        run: |
          if command -v perf >/dev/null 2>&1; then
            ./scripts/perf.sh ./build/asm-stat /tmp/big.bin --threads 4 --io mmap \
              || echo "perf counters unavailable in CI (ignored)"
          else
            echo "perf not installed; skipping"
          fi

      - name: Benchmark (smoke, 100万条, pthread + cycles)
        run: ./build/asm-bench --count 1000000 --repeat 3 --threads 4
